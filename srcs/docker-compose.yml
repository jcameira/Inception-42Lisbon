services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    volumes:
      - mariadb_data:/var/lib/sql
    env_file:
      - .env
    expose:
      - "3306"
    networks:
      - inception
    restart: always
  
  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
    env_file:
      - .env
    expose:
      - "9000"
    networks:
      - inception
    restart: always

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception
    restart: always

  redis:
    build: ./requirements/bonus/redis
    image: redis
    container_name: redis
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    depends_on:
      - wordpress
    expose:
      - 6379
    networks:
      - inception
    restart: always
    
  ftp:
    build: ./requirements/bonus/ftp
    image: ftp
    container_name: ftp
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    networks:
      - inception
    restart: always

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      device: /home/jcameira/data/mysql
      o: bind

  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      device: /home/jcameira/data/wordpress
      o: bind
  
networks:
  inception:
    name: inception
    driver: bridge


    